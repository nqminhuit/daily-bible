name: Update Lectionary

on:
  schedule:
    - cron: '0 02 24 12 *'
    - cron: '0 02 25 12 *'
  workflow_dispatch:
    inputs:
      years:
        description: 'Comma-separated years (e.g. 2026,2027). Leave empty for auto-detect.'
        required: false
        default: ''

permissions:
  contents: write
  pull-requests: write

jobs:
  update-lectionary:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25'
          cache: true

      - name: Determine years
        id: years
        env:
          INPUT_YEARS: ${{ inputs.years }}
        run: |
          if [ -n "$INPUT_YEARS" ]; then
            RAW_YEARS="$INPUT_YEARS"
          else
            CURRENT_YEAR=$(date +%Y)
            NEXT_YEAR=$((CURRENT_YEAR + 1))
            RAW_YEARS="${CURRENT_YEAR},${NEXT_YEAR}"
          fi

          YEARS=$(printf '%s' "$RAW_YEARS" | tr -d '[:space:]')
          BRANCH_YEARS=$(printf '%s' "$YEARS" | tr -cs '[:alnum:]._-' '-' | sed -e 's/^-*//' -e 's/-*$//')
          BRANCH="auto/update-lectionary-${BRANCH_YEARS}"

          git check-ref-format --branch "$BRANCH" >/dev/null

          echo "YEARS=${YEARS}" >> "$GITHUB_OUTPUT"
          echo "BRANCH=${BRANCH}" >> "$GITHUB_OUTPUT"

      - name: Run lectionary crawler
        run: make crawl-lectionary YEARS="${{ steps.years.outputs.YEARS }}"

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet resources/bible.db; then
            echo "CHANGED=false" >> "$GITHUB_OUTPUT"
          else
            echo "CHANGED=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create Pull Request
        if: steps.changes.outputs.CHANGED == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.CREATE_PR }}
          branch: ${{ steps.years.outputs.BRANCH }}
          title: 'Update lectionary for ${{ steps.years.outputs.YEARS }}'
          body: |
            Auto-generated lectionary update for years: ${{ steps.years.outputs.YEARS }}

            This PR updates `resources/bible.db` with the latest lectionary data.
            Generated by the `Update Lectionary` workflow.
          commit-message: 'Update lectionary for ${{ steps.years.outputs.YEARS }}'
          author: github-actions[bot] <github-actions[bot]@users.noreply.github.com>
