name: Update Lectionary

on:
  schedule:
    - cron: '0 02 24 12 *'
    - cron: '0 02 25 12 *'
  workflow_dispatch:
    inputs:
      years:
        description: 'Comma-separated years (e.g. 2026,2027). Leave empty for auto-detect.'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  update-lectionary:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25'
          cache: true

      - name: Determine years
        id: years
        env:
          INPUT_YEARS: ${{ inputs.years }}
        run: |
          if [ -n "$INPUT_YEARS" ]; then
            RAW_YEARS="$INPUT_YEARS"
          else
            CURRENT_YEAR=$(date +%Y)
            NEXT_YEAR=$((CURRENT_YEAR + 1))
            RAW_YEARS="${CURRENT_YEAR},${NEXT_YEAR}"
          fi

          YEARS=$(printf '%s' "$RAW_YEARS" | tr -d '[:space:]')
          echo "YEARS=${YEARS}" >> "$GITHUB_OUTPUT"

      - name: Run lectionary crawler
        run: |
          make crawl-lectionary YEARS="${{ steps.years.outputs.YEARS }}"
          # This database ships in WAL mode. Fold the write-ahead log back into
          # the main file so newly crawled data can't be left behind in an
          # uncommitted -wal sidecar.
          sqlite3 resources/bible.db 'PRAGMA wal_checkpoint(TRUNCATE);' > /dev/null
          rm -f resources/bible.db-wal resources/bible.db-shm

      - name: Commit updated lectionary
        env:
          MESSAGE: 'Update lectionary for ${{ steps.years.outputs.YEARS }}'
        run: ./.github/scripts/commit-db.sh
