name: Build Full DB

on:
  workflow_dispatch:

jobs:
  crawl-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25'
          cache: true

      - name: Install dependencies
        run: go mod download

      - name: Run
        run: |
          make crawler-all-urls
          make tsv
          make import-db
          make crawl-lectionary YEARS="2023,2024,2025,2026"

      - name: Upload DB artifacts
        uses: actions/upload-artifact@v7
        with:
          path: resources/bible.db
          if-no-files-found: error
          archive: false
