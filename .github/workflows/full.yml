name: Build Full DB

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  crawl-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25'
          cache: true

      - name: Install dependencies
        run: go mod download

      - name: Run
        run: |
          make crawler-all-urls
          make tsv
          make import-db
          make crawl-lectionary YEARS="2021,2022,2023,2024,2025,2026"
          # Fold any write-ahead log back into the main file so freshly built
          # data can't be left behind in an uncommitted -wal sidecar.
          sqlite3 resources/bible.db 'PRAGMA wal_checkpoint(TRUNCATE);' > /dev/null
          rm -f resources/bible.db-wal resources/bible.db-shm

      # commit-db.sh refuses to push a database with fewer readings than the
      # committed one, which matters most here: this rebuilds from scratch, so a
      # partly-failed crawl would otherwise replace good data with less of it.
      # Pass ALLOW_SHRINK=1 when a smaller result is genuinely intended.
      - name: Commit rebuilt database
        env:
          MESSAGE: 'Rebuild full bible.db'
        run: ./.github/scripts/commit-db.sh
