name: Build Full DB

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  crawl-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25'
          cache: true

      - name: Install dependencies
        run: go mod download

      - name: Run
        run: |
          make crawler-all-urls
          make tsv
          make import-db
          make crawl-lectionary YEARS="2021,2022,2023,2024,2025,2026"

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.CREATE_PR }}
          branch: auto/rebuild-full-db
          title: 'Rebuild full bible.db'
          body: |
            Full rebuild of `resources/bible.db` (crawl-and-build).
            Generated by the Build Full DB workflow.
          commit-message: 'Rebuild full bible.db'
          add-paths: resources/bible.db
          author: github-actions[bot] <github-actions[bot]@users.noreply.github.com>
