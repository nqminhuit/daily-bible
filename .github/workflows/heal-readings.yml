name: Heal missing readings

# Probes the next few days' readings and, when any are missing, crawls them and
# opens a PR updating resources/bible.db. Replaces the old "Daily Bible Quote"
# workflow, whose email step is obsolete now that the readings are served by
# the gospel-site website.
#
# It probes a *window* rather than only today: crawling after today is already
# broken means the site has already served a gap. Two days of lead time is
# enough for this to run, the PR to be merged, and gospel-site to sync.

on:
  workflow_dispatch:
    inputs:
      lookahead_days:
        description: 'Days ahead to probe (0 = today only)'
        required: false
        default: '2'
  schedule:
    - cron: '40 13 * * *'
      timezone: "Asia/Ho_Chi_Minh"

permissions:
  contents: write
  pull-requests: write

env:
  DB_PATH: resources/bible.db
  LOOKAHEAD_DAYS: ${{ inputs.lookahead_days || '2' }}

jobs:
  heal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: '1.25'
          cache: true

      # Build into build/, which is gitignored — the repo-root binaries the old
      # workflow produced were untracked but not ignored (only /crawler and
      # /lectionarycrawler are), so create-pull-request would have committed
      # the CLI binary alongside the database.
      - name: Build CLI and crawler
        run: |
          go build -tags "fts5" -o build/daily-bible ./cmd/cli
          go build -tags "fts5" -o build/lectionarycrawler ./tools/lectionarycrawler

      - name: Probe upcoming readings
        id: probe
        continue-on-error: true
        run: ./.github/scripts/probe-readings.sh

      - name: Crawl missing readings
        if: steps.probe.outcome == 'failure'
        run: |
          set -euo pipefail
          # Crawl every year the probe window touches, so a window spanning
          # New Year's Eve doesn't silently skip next year's dates.
          ./build/lectionarycrawler -years="$(cat build/probe-years.txt)"

      - name: Re-probe after crawling
        id: reprobe
        if: steps.probe.outcome == 'failure'
        continue-on-error: true
        run: ./.github/scripts/probe-readings.sh

      - name: Check for database changes
        id: changes
        if: steps.probe.outcome == 'failure'
        run: |
          if git diff --quiet "$DB_PATH"; then
            echo "CHANGED=false" >> "$GITHUB_OUTPUT"
          else
            echo "CHANGED=true" >> "$GITHUB_OUTPUT"
          fi

      # Open a PR whenever the crawl changed anything, even if some dates are
      # still missing — partial progress is still worth landing.
      - name: Create Pull Request
        if: steps.changes.outputs.CHANGED == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.CREATE_PR }}
          branch: auto/heal-missing-readings
          title: 'Crawl missing gospel readings'
          body: |
            Auto-crawled gospel readings that were missing for the next
            ${{ env.LOOKAHEAD_DAYS }} day(s).

            Generated by the `Heal missing readings` workflow.
          commit-message: 'Crawl missing gospel readings'
          add-paths: ${{ env.DB_PATH }}
          author: github-actions[bot] <github-actions[bot]@users.noreply.github.com>

      # Fail loudly only when readings are *still* missing after crawling —
      # that means the upstream source doesn't have them either, which needs a
      # human. A gap that healed itself is not worth an alert.
      - name: Fail if readings are still missing
        if: steps.reprobe.outcome == 'failure'
        run: |
          echo "::error::Readings still missing after crawling — the upstream source may not have published them yet."
          exit 1
