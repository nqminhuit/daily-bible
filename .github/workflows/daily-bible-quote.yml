name: Daily Bible Quote

on:
  workflow_dispatch:
    inputs:
      date:
        description: 'Date (YYYY-MM-DD). Leave empty for today.'
        required: false
        type: string
  schedule:
    - cron: '40 13 * * *'
      timezone: "Asia/Ho_Chi_Minh"

permissions:
  contents: write
  pull-requests: write

jobs:
  send-quote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25'
          cache: true

      - name: Build CLI
        run: go build -tags "fts5" -o daily-bible ./cmd/cli

      - name: Build lectionarycrawler
        run: go build -tags "fts5" -o lectionarycrawler ./tools/lectionarycrawler

      - name: Fetch today's quote
        id: quote
        continue-on-error: true
        shell: bash
        env:
          DB_PATH: resources/bible.db
        run: |
          set -euo pipefail
          DATE=${{ inputs.date || '' }}
          CMD="./daily-bible ${DATE:-today}"
          JSON=$($CMD)
          REF=$(echo "$JSON" | jq -r '.ref')
          TEXT=$(echo "$JSON" | jq -r '.verses')
          {
          echo "ref=$REF"
          echo "text<<EOF"
          echo "$REF"
          echo "$TEXT"
          echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Crawl and retry
        id: retry
        if: steps.quote.outcome == 'failure'
        shell: bash
        env:
          DB_PATH: resources/bible.db
        run: |
          set -euo pipefail
          YEAR=$(date +%Y)
          ./lectionarycrawler -years="$YEAR"
          DATE=${{ inputs.date || '' }}
          JSON=$(./daily-bible ${DATE:-today})
          REF=$(echo "$JSON" | jq -r '.ref')
          TEXT=$(echo "$JSON" | jq -r '.verses')
          {
          echo "ref=$REF"
          echo "text<<EOF"
          echo "$REF"
          echo "$TEXT"
          echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create Pull Request
        if: steps.quote.outcome == 'failure' && steps.retry.outcome == 'success'
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.CREATE_PR }}
          branch: auto/crawl-missing-reading
          title: 'Fix missing gospel reading'
          body: |
            Auto-crawled missing gospel reading.
            Generated by the Daily Bible Quote workflow.
          commit-message: 'Crawl missing gospel reading'
          author: github-actions[bot] <github-actions[bot]@users.noreply.github.com>

      - name: Send email
        if: steps.quote.outcome == 'success' || steps.retry.outcome == 'success'
        uses: dawidd6/action-send-mail@v18
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.SMTP_APP_PASSWORD }}

          subject: "Daily Bible Quote: ${{ steps.quote.outcome == 'success' && steps.quote.outputs.ref || steps.retry.outputs.ref }}"

          to: ${{ secrets.TO_EMAIL }}
          from: GitHub Actions <${{ secrets.MAIL_USERNAME }}>

          body: |
            ${{ steps.quote.outcome == 'success' && steps.quote.outputs.text || steps.retry.outputs.text }}
            — ${{ steps.quote.outcome == 'success' && steps.quote.outputs.ref || steps.retry.outputs.ref }}
