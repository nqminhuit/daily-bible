name: Daily Bible Quote

on:
  workflow_dispatch:
    inputs:
      date:
        description: 'Date (YYYY-MM-DD). Leave empty for today.'
        required: false
        type: string
  schedule:
    - cron: '40 13 * * *'
      timezone: "Asia/Ho_Chi_Minh"

jobs:
  send-quote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25'
          cache: true

      - name: Build CLI
        run: go build -tags "fts5" -o daily-bible ./cmd/cli

      - name: Fetch today's quote
        id: quote
        shell: bash
        env:
          DB_PATH: resources/bible.db
        run: |
          set -euo pipefail
          DATE=${{ inputs.date || '' }}
          CMD="./daily-bible ${DATE:-today}"
          JSON=$($CMD)
          REF=$(echo "$JSON" | jq -r '.ref')
          TEXT=$(echo "$JSON" | jq -r '.verses')
          {
          echo "ref=$REF"
          echo "text<<EOF"
          echo "$REF"
          echo "$TEXT"
          echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Send email
        uses: dawidd6/action-send-mail@v18
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.SMTP_APP_PASSWORD }}

          subject: "Daily Bible Quote: ${{ steps.quote.outputs.ref }}"

          to: ${{ secrets.TO_EMAIL }}
          from: GitHub Actions <${{ secrets.MAIL_USERNAME }}>

          body: |
            ${{ steps.quote.outputs.text }}
            — ${{ steps.quote.outputs.ref }}
