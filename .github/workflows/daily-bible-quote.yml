name: Daily Bible Quote

on:
  workflow_dispatch:
    inputs:
      date:
        description: 'Date (YYYY-MM-DD). Leave empty for today.'
        required: false
        type: string
  schedule:
    - cron: '0 7 * * *'

jobs:
  send-quote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25'
          cache: true

      - name: Install go-sendxmpp
        run: sudo apt-get install -y go-sendxmpp

      - name: Build CLI
        run: go build -tags "fts5" -o daily-bible ./cmd/cli

      - name: Fetch today's quote
        id: quote
        shell: bash
        env:
          DB_PATH: resources/bible.db
        run: |
          set -euo pipefail
          DATE=${{ inputs.date || '' }}
          CMD="./daily-bible ${DATE:-today}"
          JSON=$($CMD)
          REF=$(echo "$JSON" | jq -r '.ref')
          TEXT=$(echo "$JSON" | jq -r '.verses')
          {
          echo "ref=$REF"
          echo "text<<EOF"
          echo "$REF"
          echo "$TEXT"
          echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Send via XMPP
        env:
          XMPP_JID: ${{ secrets.XMPP_JID }}
          XMPP_PASS: ${{ secrets.XMPP_PASS }}
          XMPP_RECIPIENTS: ${{ secrets.XMPP_RECIPIENTS }}
          QUOTE: ${{ steps.quote.outputs.text }}
        run: |
          for recipient in $XMPP_RECIPIENTS; do
            echo "$QUOTE" | go-sendxmpp -u "$XMPP_JID" -p "$XMPP_PASS" "$recipient"
          done
